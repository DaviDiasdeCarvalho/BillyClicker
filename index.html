<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Billy Clicker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <link rel="icon" href="imgs/BillyNaPraia.png" type="image/png">

</head>
<body>
    <div id="containerPrincipal">
        <div id="espacoBotao">
            <button id="botao_principal"><img src="imgs/BillyDeitado.png"></button>
        
            <div id="elementosTemp"></div>
        </div>

        <div id="menu">
            <span id="contador">0</span>
            <div id="botoesDeUpgrade">
                <div class="botaoUpgrade"><button class="clickUP" id="upgradeClick1">+1 poder de click</button><span class="precoUP" id="precoClick1">15</span></div>
                <div class="botaoUpgrade"><button class="clickUP" id="upgradeClick10">+10 poder de click</button><span class="precoUP" id="precoClick10">2500</span></div>
                <div class="botaoUpgrade"><button class="clickUP" id="comprarAutoClick1">Comprar 1 autoclicker</button><span class="precoUP" id="precoAutoClick1">500</span></div>
                <div class="botaoUpgrade"><button class="clickUP" id="comprarAutoClick10">Comprar 10 autoclickers</button><span class="precoUP" id="precoAutoClick10">-</span></div>
                <div class="botaoUpgrade"><button class="clickUP" id="comprarAutoClick100">Comprar 100 autoclickers</button><span class="precoUP" id="precoAutoClick100">-</span></div>
                <div class="statusClickers"><p>Autoclickers: <span id="quantosAutoClick">0</span></p></div>
                <div class="statusClickers"><p>Produção: <span id="producaoAutoClick">0</span> cliques/s</p></div>
            </div>
        </div>
    </div>







    <div id="conquistas">
        <div class="escondido" id="conquista"><h1>Parabens pelos 50 cliques👍</h1></div>
    </div>


    <script src="javascript.js"></script>
</body>
</html>
