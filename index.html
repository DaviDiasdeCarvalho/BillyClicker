<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Billy Clicker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Winky+Rough:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

</head>
<body>
    <div id="containerPrincipal">
        <div id="espacoBotao">
            <button id="botao_principal"><img src="imgs/BillyCocao.png"></button>
        </div>

        <div id="menu">
            <span id="contador">0</span>
            <div id="botoesDeUpgrade">
                <div class="botaoUpgrade"><button class="clickUP" id="upgradeClick1">+1 poder de click</button><span class="precoUP" id="precoClick1">15</span></div>
                <div class="botaoUpgrade"><button class="clickUP" id="upgradeClick10">+10 poder de click</button><span class="precoUP" id="precoClick10">2500</span></div>
            </div>
        </div>
    </div>







    <div id="conquistas">
        <div class="escondido" id="conquista50"><h1>Parabens pelos 10 cliques👍</h1></div>
    </div>


    <script src="javascript.js"></script>

</html>
